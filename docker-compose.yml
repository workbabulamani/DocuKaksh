services:
  docukaksh:
    build: .
    image: docukaksh:latest
    container_name: docukaksh
    restart: unless-stopped
    # Secrets and settings come from .env on the host. It is optional here so the file can be
    # checked in without it, but the app refuses to start until ENCRYPTION_KEY is set.
    env_file:
      - path: .env
        required: false
    environment:
      # These are fixed inside the container, whatever .env says for the host.
      DATA_DIR: /data
      PORT: "3000"
    ports:
      # 0.0.0.0 publishes the port to the network, so other devices can reach it.
      - "0.0.0.0:${PORT:-3000}:3000"
    volumes:
      # All app data (database, encrypted uploads, previews) lives in this host folder.
      # Set DATA_HOST_DIR in .env to move it, for example to another drive.
      - ${DATA_HOST_DIR:-./docukaksh-data}:/data
    # Small footprint: the app itself is a few tens of MB of RAM.
    mem_limit: 256m
    cpus: 1.0
