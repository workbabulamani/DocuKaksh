<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#4f46e5">
  <title>DocuKaksh</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="auth" class="auth hidden"></div>

  <div id="app" class="app hidden">
    <div id="scrim" class="scrim"></div>

    <aside id="sidebar" class="sidebar">
      <div class="brand"><span class="logo">D</span>DocuKaksh</div>

      <div class="side-head">
        <span>Persons</span>
        <button id="new-person" class="btn small" type="button">+ New</button>
      </div>
      <nav id="person-list" class="person-list" aria-label="Persons"></nav>

      <div id="admin-section" class="side-section hidden">
        <div class="side-head"><span>Admin</span></div>
        <button id="nav-users" class="person" type="button" data-nav="users">
          <span class="pname">Users</span>
        </button>
      </div>

      <button id="account-btn" class="account" type="button" aria-label="Account options"></button>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menu-btn" class="btn ghost menu-btn" type="button" aria-label="Open menu">☰</button>
        <nav id="crumbs" class="crumbs" aria-label="Location"></nav>
        <input id="search" class="search" type="search" placeholder="Search all files" aria-label="Search all files">
      </header>

      <div id="toolbar" class="toolbar">
        <button id="new-folder" class="btn" type="button">New folder</button>
        <button id="upload-btn" class="btn primary" type="button">Upload</button>
        <input id="file-input" type="file" multiple hidden>
        <span class="grow"></span>
        <button id="person-more" class="btn ghost" type="button" aria-label="Person options">Person ⋯</button>
      </div>

      <div id="users-toolbar" class="toolbar hidden">
        <span class="muted">Accounts on this install</span>
        <span class="grow"></span>
        <button id="new-user" class="btn primary" type="button">New user</button>
      </div>

      <div id="upload-progress" class="progress hidden">
        <div class="bar"></div>
        <span></span>
      </div>

      <section id="content" class="content" aria-live="polite"></section>
    </main>
  </div>

  <div id="drop-hint" class="drop-hint hidden">Drop files to upload</div>
  <div id="modal-root"></div>
  <div id="toast" class="toast hidden" role="status"></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
